name: Build and Push

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Временно смотрим, какие claims реально выдаёт GitHub OIDC.
      # Сам JWT-токен не выводим.
      - name: Debug OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')

            const payload = JSON.parse(
              Buffer.from(
                token.split('.')[1],
                'base64url'
              ).toString()
            )

            console.log('aud:', payload.aud)
            console.log('sub:', payload.sub)
            console.log('repository:', payload.repository)
            console.log('ref:', payload.ref)

      # Пока отключено, чтобы configure-aws-credentials
      # не делал retry несколько минут.
      #
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v5
      #   with:
      #     role-to-assume: arn:aws:iam::501683248315:role/wallpaper-github-actions
      #     aws-region: eu-central-1
      #
      # - name: Verify AWS identity
      #   run: aws sts get-caller-identity

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/wallpaper-still:latest \
            .

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/wallpaper-still:latest